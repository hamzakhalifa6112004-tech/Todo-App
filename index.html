<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Todo app</title>
  </head>
  <body>
    <header class="header">
      <h1>Todo</h1>
      <button
        class="theme-toggle"
        type="button"
        aria-label="Toggle theme"
      ></button>
    </header>

    <div class="container">
      <main>
        <form class="input-section">
          <div class="input-container">
            <input
              type="text"
              class="new-todo-input"
              placeholder="Create a new todo..."
              aria-label="Create a new todo..."
            />
            <button class="add-todo-btn" type="submit" aria-label="Add todo">
              Add
            </button>
          </div>
        </form>

        <section class="todo-list-container">
          <ul class="todo-list"></ul>

          <div class="list-footer">
            <span class="items-left"></span>
            <div class="filters">
              <button class="filter-btn active" type="button" data-filter="all">
                All
              </button>
              <button class="filter-btn" type="button" data-filter="active">
                Active
              </button>
              <button class="filter-btn" type="button" data-filter="completed">
                Completed
              </button>
            </div>
            <button class="clear-completed" type="button">
              Clear Completed
            </button>
          </div>
        </section>
      </main>

      <footer class="attribution">Drag and drop to reorder list.</footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
